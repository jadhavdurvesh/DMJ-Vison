[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmj-vision"
version = "0.3.0"
description = "Privacy-aware, confidence-led vision operations MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
vision = [
  "opencv-python-headless>=4.10,<5.0",
  "ultralytics>=8.3,<9.0",
]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
dmj-vision-worker = "vision_system.vision.worker:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
